<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 609" width="940" height="609" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.0">
  <style>
    /* Default state is FULLY VISIBLE. The animation runs from hidden, so any renderer that
       blocks CSS animation shows the complete terminal instead of a blank card. */
    .ln { opacity: 1; animation: type 11.0s steps(1) infinite; }
    @keyframes type { 0% {opacity:0} 3% {opacity:1} 93% {opacity:1} 100% {opacity:0} }
  </style>
  <rect width="940" height="609" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect width="940" height="38" rx="10" fill="#161b22"/><rect y="28" width="940" height="10" fill="#161b22"/>
  <circle cx="22" cy="19" r="6" fill="#ff5f56"/><circle cx="42" cy="19" r="6" fill="#ffbd2e"/><circle cx="62" cy="19" r="6" fill="#27c93f"/>
  <text x="470.0" y="24" fill="#8b949e" font-size="12" text-anchor="middle">salvage - verified revenue recovery</text>
  <text xml:space="preserve" class="ln" style="animation-delay:0.00s" x="26" y="64" fill="#7ee787">$ git clone https://github.com/rushikeshgoud19/salvage &amp;&amp; cd salvage</text>
  <text xml:space="preserve" class="ln" style="animation-delay:0.32s" x="26" y="85" fill="#7ee787">$ pip install -e . &amp;&amp; python -m salvage demo      # no keys, no network</text>
  <text xml:space="preserve" class="ln" style="animation-delay:0.64s" x="26" y="106" fill="#8b949e">wrote 240 payments -&gt; data/payments.json and 240 labels -&gt; data/truth.json</text>
  <text xml:space="preserve" class="ln" style="animation-delay:0.96s" x="26" y="127" fill="#c9d1d9" font-weight="600">ran 240 records: 102 seal-verified recoveries, 0 isolated failures</text>
  <text xml:space="preserve" class="ln" style="animation-delay:1.28s" x="26" y="148" fill="#58a6ff" font-weight="600">₹59,031.02 recovered of ₹111,313.68 at risk on the holdout split</text>
  <text xml:space="preserve" class="ln" style="animation-delay:1.60s" x="26" y="169" fill="#ff7b72" font-weight="600">verification gap ₹43,996.41   -&gt;   RESULTS.md</text>
  <text xml:space="preserve" class="ln" style="animation-delay:2.24s" x="26" y="211" fill="#8b949e">  the same run, scored the way everyone else scores it:</text>
  <text xml:space="preserve" class="ln" style="animation-delay:2.56s" x="26" y="232" fill="#8b949e">  Naive agent (trusts the API)       ₹103,027.43   92.6%</text>
  <text xml:space="preserve" class="ln" style="animation-delay:2.88s" x="26" y="253" fill="#3fb950" font-weight="600">  salvage (seal-verified)             ₹59,031.02   53.0%</text>
  <text xml:space="preserve" class="ln" style="animation-delay:3.20s" x="26" y="274" fill="#ff7b72" font-weight="600">  Fiction                             ₹43,996.41   42.7% of the claim</text>
  <text xml:space="preserve" class="ln" style="animation-delay:3.84s" x="26" y="316" fill="#7ee787">$ python -m salvage prove      # don&#x27;t trust the README. make it prove itself.</text>
  <text xml:space="preserve" class="ln" style="animation-delay:4.16s" x="26" y="337" fill="#3fb950" font-weight="600">PASS  forged seal — a ledger edited to fake a recovery no longer verifies</text>
  <text xml:space="preserve" class="ln" style="animation-delay:4.48s" x="26" y="358" fill="#3fb950" font-weight="600">PASS  double charge — a customer who already paid is never charged again</text>
  <text xml:space="preserve" class="ln" style="animation-delay:4.80s" x="26" y="379" fill="#3fb950" font-weight="600">PASS  prompt injection — hostile text cannot choose an action or leak a secret</text>
  <text xml:space="preserve" class="ln" style="animation-delay:5.12s" x="26" y="400" fill="#3fb950" font-weight="600">PASS  fabricated recovery — 2xx that moved no money is not counted</text>
  <text xml:space="preserve" class="ln" style="animation-delay:5.44s" x="26" y="421" fill="#3fb950" font-weight="600">PASS  offline guarantee — 20 records ran, 0 network calls</text>
  <text xml:space="preserve" class="ln" style="animation-delay:5.76s" x="26" y="442" fill="#3fb950" font-weight="600">PASS  not recovery-specific — same gate catches it on refunds, no shared code</text>
  <text xml:space="preserve" class="ln" style="animation-delay:6.08s" x="26" y="463" fill="#8b949e">      40 refunds returned 200. 30 processed. 8 stuck at status=pending.</text>
  <text xml:space="preserve" class="ln" style="animation-delay:6.40s" x="26" y="484" fill="#c9d1d9" font-weight="600">all 6 claims held</text>
  <text xml:space="preserve" class="ln" style="animation-delay:7.04s" x="26" y="526" fill="#7ee787">$ python -m pytest tests/ -q</text>
  <text xml:space="preserve" class="ln" style="animation-delay:7.36s" x="26" y="547" fill="#3fb950" font-weight="600">478 passed in 12.47s</text>
  <text xml:space="preserve" class="ln" style="animation-delay:7.68s" x="26" y="568" fill="#8b949e">(asserted network-free: httpx patched to raise, still green)</text>
</svg>